[build-system]
requires = ["hatchling>=1.29,<1.31"]
build-backend = "hatchling.build"

[project]
name = "idx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "your-org" }
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
]
dependencies = ["httpx>=0.27", "prefect>=3.4", "prefect-slack>=0.3", "polars>=1.0", "pdfplumber>=0.10", "boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/your-org/idx"
Repository = "https://github.com/your-org/idx"

[tool.hatch.build.targets.wheel]
packages = ["src/idx"]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.0.0",
    "respx>=0.22.0",
]
lint = [
    "ruff>=0.11.0",
]
dev = []

[tool.rhiza-task]
license_ignore_packages = ["text-unidecode", "Unidecode"]

[tool.bumpversion]
current_version = "0.1.0"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.check_test_layout]
enforce = false
reason = "Tests use TestFunctionName classes to group tests by function; per-module coverage is enforced by the 90% coverage gate."

[tool.deptry.package_module_name_map]
python-dotenv = "dotenv"
prefect-slack = "prefect"
